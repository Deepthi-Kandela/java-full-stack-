<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <link rel="stylesheet" href="../styles/login.css">
</head>

<body data-public="1">
    <video class="bg-video" src="../bg-video.mp4" autoplay muted loop playsinline></video>
    <form id="loginForm">
        <fieldset>
            <legend>Think Mart</legend>
            <h1>Sign-In</h1>

            <label for="email">Email: </label>
            <input type="email" required id="email" placeholder="Enter Email">

            <br><br>
            <label for="password">Password: </label>
            <input type="password" required minlength="6" maxlength="20" id="password" placeholder="Enter Password">

            <br><br>
            <p id="formMsg" style="color:#ffb3b3;font-weight:bold;min-height:1.4em"></p>
            <button type="submit">Login</button>
            <button type="reset">Cancel</button>

            <p class="links">New user? <a href="Register-Page.html">Register here</a></p>
        </fieldset>
    </form>
    <script src="../js/app.js"></script>
</body>

</html>

# ===== Think Mart configuration =====
# Every value can be overridden with an environment variable (handy for deployment).

server.port=${PORT:8080}

# --- MySQL ---------------------------------------------------------------
# The database "thinkmart" is created automatically if it does not exist.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/thinkmart?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# Tables are created / updated automatically from the entity classes.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# --- File upload (profile pictures) --------------------------------------
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
app.upload-dir=${UPLOAD_DIR:uploads}

# --- JWT -----------------------------------------------------------------
# CHANGE THIS before going live. Must be at least 32 characters.
app.jwt.secret=${JWT_SECRET:change-this-secret-key-to-something-long-and-random-123456}
app.jwt.expiration-hours=24

# --- Default admin account (created on first start) ----------------------
app.admin.email=${ADMIN_EMAIL:admin@thinkmart.com}
app.admin.password=${ADMIN_PASSWORD:Admin@123}
